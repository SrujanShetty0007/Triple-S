<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Reference</title>
    <style>
        /* From Uiverse.io by PriyanshuGupta28 */ 
.marquee {
  overflow: hidden;
  /* hide the scrolling overflow */
  width: 100%;
  -webkit-mask-image: linear-gradient(
    to right,
    transparent 0%,
    black 10%,
    black 90%,
    transparent 100%
  );
  mask-image: linear-gradient(
    to right,
    transparent 0%,
    black 10%,
    black 90%,
    transparent 100%
  );
}
.marquee__inner {
  display: flex;
  width: max-content;
  animation: marquee 15s linear infinite;
}

.marquee__group {
  display: flex;
}

.marquee__group span {
  margin: 0 1.5rem;
  white-space: nowrap;
  background: #000000;
  color: white;
  padding: 4px 16px 4px 12px;
  border-radius: 6px;
  font-size: 1.2rem;
}

@keyframes marquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

    </style>
</head>
<body>
    <!-- From Uiverse.io by PriyanshuGupta28 -->
    <div class="marquee">
        <div class="marquee__inner">
            <div class="marquee__group">
                <span>🔥 Item 1</span>
                <span>✨ Item 2</span>
                <span>🚀 Item 3</span>
                <span>🌟 Item 4</span>
                <span>🎉 Item 5</span>
            </div>
    
            <div class="marquee__group">
                <span>🔥 Item 1</span>
                <span>✨ Item 2</span>
                <span>🚀 Item 3</span>
                <span>🌟 Item 4</span>
                <span>🎉 Item 5</span>
            </div>
        </div>
    </div>

</body>
</html>
