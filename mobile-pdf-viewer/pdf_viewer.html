<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9NPTSX512J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9NPTSX512J');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description"
        content="PDF viewer for Triple S study materials, optimized for reading engineering notes, model papers, and previous year question papers." />
    <meta name="keywords"
        content="PDF viewer, document reader, engineering study materials, Triple S, student study support" />
    <meta name="author" content="Srujan S Shetty">
    <meta name="robots" content="noindex, follow">
    <meta property="og:title" content="Triple S - PDF Viewer">
    <meta property="og:description" content="PDF viewer for engineering study materials and academic resources.">
    <meta property="og:type" content="website">
    <title>Triple S - PDF Viewer</title>
    <link rel="shortcut icon" href="../assets/images/logo1.png" type="image/png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./pdf_viewer.css">
    <link rel="stylesheet" href="../assets/css/pdf-loading.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="../assets/js/pdf-watermarker.js"></script>
</head>

<body>
    <header class="pdf-header">
        <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <h1 id="document-title">PDF Viewer</h1>
    </header>

    <div id="viewer-container" class="viewer-container">
        <div class="viewer-toolbar">
            <div class="page-navigation">
                <button id="prev-page" class="nav-btn" title="Previous Page"><i
                        class="fas fa-chevron-left"></i></button>
                <div class="page-info">
                    <span>Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
                </div>
                <button id="next-page" class="nav-btn" title="Next Page"><i class="fas fa-chevron-right"></i></button>
            </div>
            <button id="download-btn" class="action-btn" title="Download PDF">
                <i class="fas fa-download"></i> Download
            </button>
        </div>

        <div class="canvas-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <!-- Download notification -->
    <div id="download-notification" class="download-notification">
        <i class="fas fa-circle-notch fa-spin"></i>
        <span id="notification-text">Processing download...</span>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

        // DOM Elements
        const viewerContainer = document.getElementById("viewer-container");
        const canvas = document.getElementById("pdf-canvas");
        const ctx = canvas.getContext("2d");
        const currentPageEl = document.getElementById("current-page");
        const totalPagesEl = document.getElementById("total-pages");
        const downloadBtn = document.getElementById("download-btn");
        const prevPageBtn = document.getElementById("prev-page");
        const nextPageBtn = document.getElementById("next-page");
        const downloadNotification = document.getElementById("download-notification");
        const notificationText = document.getElementById("notification-text");
        const documentTitle = document.getElementById("document-title");

        let currentPDF = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentPdfUrl = '';

        // Show download notification
        function showNotification(message, type = 'loading') {
            downloadNotification.className = 'download-notification show';
            notificationText.textContent = message;

            const icon = downloadNotification.querySelector('i');
            icon.className = type === 'loading' ? 'fas fa-circle-notch fa-spin' :
                type === 'success' ? 'fas fa-check-circle' :
                    'fas fa-exclamation-circle';

            downloadNotification.classList.add(type);

            if (type !== 'loading') {
                setTimeout(() => {
                    downloadNotification.classList.remove('show');
                    setTimeout(() => {
                        downloadNotification.classList.remove(type);
                    }, 300);
                }, 3000);
            }
        }

        // Hide download notification
        function hideNotification() {
            downloadNotification.classList.remove('show');
        }

        function getPDFFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('file') || urlParams.get('pdf');
        }
        function viewPDF(pdfPath) {
            // Show error if no PDF specified
            if (!pdfPath) {
                viewerContainer.innerHTML = '<p class="error">No PDF specified. Please go back and select a PDF.</p>';
                return;
            }

            const pathParts = pdfPath.split('/');
            const fileName = pathParts[pathParts.length - 1];

            // Get title from URL parameter if available
            const urlParams = new URLSearchParams(window.location.search);
            const titleParam = urlParams.get('title');
            const displayTitle = titleParam || fileName;

            // Set document title
            documentTitle.textContent = displayTitle;

            const url = `../${pdfPath}`;
            currentPdfUrl = url;

            canvas.style.display = "none";

            const loadingIndicator = document.createElement("div");
            loadingIndicator.id = "loading-indicator";
            loadingIndicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading PDF...';
            viewerContainer.appendChild(loadingIndicator);

            pdfjsLib.getDocument(url).promise.then((pdf) => {
                const indicator = document.getElementById("loading-indicator");
                if (indicator) indicator.remove();
                canvas.style.display = "block";

                currentPDF = pdf;
                currentPage = 1;
                totalPages = pdf.numPages;
                totalPagesEl.textContent = totalPages;
                document.title = `${displayTitle} - PDF Viewer`;

                downloadBtn.onclick = async () => {
                    try {
                        // Show download notification
                        showNotification('Preparing download...');
                        downloadBtn.disabled = true;

                        // Check if watermarker is available
                        if (window.pdfWatermarker) {
                            try {
                                // Watermark the PDF
                                showNotification('Applying watermark...');
                                const watermarkedPdf = await window.pdfWatermarker.watermarkPDF(url);

                                // Create download link
                                showNotification('Starting download...');
                                const downloadUrl = URL.createObjectURL(watermarkedPdf);
                                const tempLink = document.createElement('a');
                                tempLink.href = downloadUrl;
                                tempLink.download = fileName;
                                document.body.appendChild(tempLink);
                                tempLink.click();
                                document.body.removeChild(tempLink);

                                // Show success notification
                                showNotification('Download complete!', 'success');

                                // Clean up
                                setTimeout(() => {
                                    URL.revokeObjectURL(downloadUrl);
                                }, 100);
                            } catch (error) {
                                console.error('Error downloading watermarked PDF:', error);
                                showNotification('Watermarking failed. Trying direct download...', 'error');

                                // Fallback to direct download
                                setTimeout(() => {
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = fileName;
                                    a.target = '_blank';
                                    a.click();
                                    showNotification('Download started!', 'success');
                                }, 1000);
                            }
                        } else {
                            // Fallback to direct download
                            showNotification('Starting download...');
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = fileName;
                            a.target = '_blank';
                            a.click();
                            showNotification('Download started!', 'success');
                        }
                    } catch (error) {
                        console.error('Error during download:', error);
                        showNotification('Download failed. Please try again.', 'error');
                    } finally {
                        downloadBtn.disabled = false;
                    }
                };
                renderPage(currentPage);
                updateButtonStates();
            }).catch(error => {
                console.error("Error loading PDF:", error);
                viewerContainer.innerHTML += `<p class="error">Error loading PDF: ${error.message}</p>`;
            });
        }

        function renderPage(num) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f0f0f0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#666";
            ctx.font = "20px Arial, sans-serif";
            ctx.fillText("Loading page...", canvas.width / 2 - 70, canvas.height / 2);
            currentPDF.getPage(num).then((page) => {
                const viewport = page.getViewport({ scale: 1.0 });
                const containerWidth = window.innerWidth - 20;
                const scale = containerWidth / viewport.width;

                const pixelRatio = window.devicePixelRatio || 1;
                const scaledViewport = page.getViewport({ scale: scale });
                canvas.style.width = Math.floor(scaledViewport.width) + 'px';
                canvas.style.height = Math.floor(scaledViewport.height) + 'px';
                canvas.width = Math.floor(scaledViewport.width * pixelRatio);
                canvas.height = Math.floor(scaledViewport.height * pixelRatio);

                ctx.scale(pixelRatio, pixelRatio);
                page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise.then(() => {
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                });
                currentPageEl.textContent = num;
                updateButtonStates();
            });
        }

        function updateButtonStates() {
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;

            // Update button appearance based on state
            prevPageBtn.classList.toggle('disabled', currentPage <= 1);
            nextPageBtn.classList.toggle('disabled', currentPage >= totalPages);
        }

        prevPageBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        };

        nextPageBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            viewPDF(getPDFFromURL());
        });
        window.addEventListener('orientationchange', () => {
            if (currentPDF) {
                setTimeout(() => renderPage(currentPage), 100);
            }
        });
    </script>
</body>

</html>
