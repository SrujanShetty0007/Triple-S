<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Mobile PDF viewer" />
    <title>Mobile PDF Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            text-align: center;
            margin: 0.8rem 0;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .back-btn {
            display: block;
            margin: 0.8rem;
            padding: 0.5rem;
            background: #f1f1f1;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
        }

        .viewer-container {
            padding: 0.8rem;
            background: white;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            text-align: center;
            overflow: hidden;
        }

        /* Header with download button and page info */
        .viewer-header {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eee;
        }

        #download-btn {
            padding: 0.8rem;
            background-color: #38b000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            font-size: 1rem;
        }

        #page-info {
            font-size: 1rem;
            color: #555;
            font-weight: 500;
        }

        /* PDF canvas */
        canvas {
            border: 1px solid #ddd;
            width: 100%;
            height: auto !important;
            display: block;
            margin: 0 auto;
            image-rendering: high-quality;
            touch-action: pan-y;
        }

        /* Navigation buttons */
        .nav-buttons {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.8rem;
        }

        .nav-buttons button {
            padding: 0.8rem;
            border: none;
            background: #4361ee;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            font-size: 1rem;
        }

        .nav-buttons button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Utility classes */
        .hidden {
            display: none;
        }

        #loading-indicator {
            padding: 2rem;
            font-size: 1.2rem;
            color: #666;
        }

        .error {
            color: #e63946;
            padding: 0.8rem;
            background-color: #ffeeee;
            border-radius: 5px;
            margin: 0.8rem 0;
        }
    </style>
</head>

<body>
    <a href="javascript:history.back()" class="back-btn">← Back</a>
    <h1>PDF Viewer</h1>

    <div id="viewer-container" class="viewer-container">
        <div class="viewer-header">
            <button id="download-btn">Download PDF</button>
            <span id="page-info">Page <span id="current-page">1</span> / <span id="total-pages">1</span></span>
        </div>

        <canvas id="pdf-canvas"></canvas>

        <div class="nav-buttons">
            <button id="prev-page">Previous Page</button>
            <button id="next-page">Next Page</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

        // DOM Elements
        const viewerContainer = document.getElementById("viewer-container");
        const canvas = document.getElementById("pdf-canvas");
        const ctx = canvas.getContext("2d");
        const currentPageEl = document.getElementById("current-page");
        const totalPagesEl = document.getElementById("total-pages");
        const downloadBtn = document.getElementById("download-btn");
        const prevPageBtn = document.getElementById("prev-page");
        const nextPageBtn = document.getElementById("next-page");

        let currentPDF = null;
        let currentPage = 1;
        let totalPages = 0;

        function getPDFFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('pdf');
        }
        function viewPDF(pdfPath) {
            // Show error if no PDF specified
            if (!pdfPath) {
                viewerContainer.innerHTML = '<p class="error">No PDF specified. Please go back and select a PDF.</p>';
                return;
            }

            const pathParts = pdfPath.split('/');
            const fileName = pathParts[pathParts.length - 1];

            const url = `../${pdfPath}`;

            canvas.style.display = "none";
            const loadingIndicator = document.createElement("div");
            loadingIndicator.id = "loading-indicator";
            loadingIndicator.textContent = "Loading PDF...";
            viewerContainer.appendChild(loadingIndicator);

            pdfjsLib.getDocument(url).promise.then((pdf) => {
                const indicator = document.getElementById("loading-indicator");
                if (indicator) indicator.remove();
                canvas.style.display = "block";
                currentPDF = pdf;
                currentPage = 1;
                totalPages = pdf.numPages;
                totalPagesEl.textContent = totalPages;
                document.title = `${fileName} - Mobile PDF Viewer`;

                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.target = '_blank';
                    a.click();
                };
                renderPage(currentPage);
                updateButtonStates();
            }).catch(error => {
                console.error("Error loading PDF:", error);
                viewerContainer.innerHTML += `<p class="error">Error loading PDF: ${error.message}</p>`;
            });
        }

        function renderPage(num) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f0f0f0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#666";
            ctx.font = "20px Arial";
            ctx.fillText("Loading page...", canvas.width / 2 - 70, canvas.height / 2);
            currentPDF.getPage(num).then((page) => {
                const viewport = page.getViewport({ scale: 1.0 });
                const containerWidth = window.innerWidth - 20;
                const scale = containerWidth / viewport.width;

                const pixelRatio = window.devicePixelRatio || 1;
                const scaledViewport = page.getViewport({ scale: scale });
                canvas.style.width = Math.floor(scaledViewport.width) + 'px';
                canvas.style.height = Math.floor(scaledViewport.height) + 'px';
                canvas.width = Math.floor(scaledViewport.width * pixelRatio);
                canvas.height = Math.floor(scaledViewport.height * pixelRatio);

                ctx.scale(pixelRatio, pixelRatio);
                page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise.then(() => {
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                });
                currentPageEl.textContent = num;
                updateButtonStates();
            });
        }

        function updateButtonStates() {
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;
        }
        prevPageBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        };

        nextPageBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            viewPDF(getPDFFromURL());
        });
        window.addEventListener('orientationchange', () => {
            if (currentPDF) {
                setTimeout(() => renderPage(currentPage), 100);
            }
        });
    </script>
</body>

</html>
