<!DOCTYPE html>
<html lang="en">

<head>
    <title>Learnera - Edit Profile</title>
</head>

<body>
    <h1>Edit Profile</h1>

    <input type="text" id="username" placeholder="Username"><br>
    <input type="date" id="dob"><br>
    <input type="file" id="profilePic"><br>
    <button id="saveBtn">Save Changes</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getAuth, updateProfile } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHZcDv3pXIU9J3CASXi3sM-V7mZsMuqBM",
            authDomain: "triple-s-bd006.firebaseapp.com",
            projectId: "triple-s-bd006",
            storageBucket: "triple-s-bd006.appspot.com",
            messagingSenderId: "933483210420",
            appId: "1:933483210420:web:66fde1b5571ef1741299e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const saveBtn = document.getElementById('saveBtn');

        saveBtn.addEventListener('click', async () => {
            saveBtn.textContent = 'Saving...';
            try {
                const user = auth.currentUser;
                const username = document.getElementById('username').value;
                const dob = document.getElementById('dob').value;
                const file = document.getElementById('profilePic').files[0];

                let profilePicURL = user.photoURL; // Keep old URL if not changing

                if (file) {
                    const storageRef = ref(storage, `profile-pics/${user.uid}`);
                    await uploadBytes(storageRef, file);
                    profilePicURL = await getDownloadURL(storageRef);
                }

                await updateProfile(user, {
                    displayName: username,
                    photoURL: profilePicURL
                });

                await setDoc(doc(db, "users", user.uid), {
                    dateOfBirth: dob,
                    profilePictureUrl: profilePicURL
                });

                saveBtn.textContent = 'Saved!';
            } catch (error) {
                console.error(error);
                alert('Failed to save: ' + error.message);
                saveBtn.textContent = 'Save Changes';
            }
        });
    </script>
</body>

</html>
