<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Triple-S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6a82fb;
            --secondary: #fc5c7d;
            --accent: #43e97b;
            --bg: #f7f7fa;
            --card-bg: #fff;
            --input-bg: #f0f0f3;
            --border: #e0e0e0;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --radius: 1.5rem;
            --transition: 0.3s cubic-bezier(.4, 0, .2, 1);
            --heading-font: 'Montserrat', 'Poppins', Arial, sans-serif;
            --body-font: 'Montserrat', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: var(--body-font);
            background: linear-gradient(120deg, var(--primary), var(--secondary), var(--accent));
            background-size: 200% 200%;
            animation: gradientMove 8s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background: var(--card-bg);
            border-radius: 6px;
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem 2rem 2rem;
            width: 100%;
            max-width: 500px;
            margin: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            width: 100%;
            margin-bottom: 2rem;
            border-radius: 2rem;
            background: var(--input-bg);
            overflow: hidden;
            font-family: var(--heading-font);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem 0.5rem;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            background: none;
            border: none;
            outline: none;
            transition: color var(--transition), background var(--transition);
            font-family: var(--heading-font);
            font-size: 1.1rem;
            letter-spacing: 0.02em;
        }

        .tab.active {
            color: var(--primary);
            background: #eaf0ff;
            font-weight: 700;
        }

        .form {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeIn 0.5s;
            font-family: var(--body-font);
        }

        .form.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.95rem;
            color: #444;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            background: var(--input-bg);
            font-size: 1.08rem;
            transition: border var(--transition);
            font-family: var(--body-font);
            font-weight: 500;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 0.8rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: #fff;
            font-size: 1.18rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(106, 130, 251, 0.08);
            transition: background var(--transition), transform var(--transition);
            font-family: var(--heading-font);
            letter-spacing: 0.03em;
        }

        /* Social authentication styles removed */

        .switch-link {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            font-size: 1.01rem;
            font-weight: 500;
            margin-top: 0.5rem;
            display: inline-block;
            font-family: var(--body-font);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--heading-font);
            font-weight: 800;
            letter-spacing: 0.02em;
            margin-bottom: 0.5rem;
        }

        .login-title {
            font-family: var(--heading-font);
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 0.04em;
            line-height: 1.1;
        }

        .input-group label {
            font-size: 1.05rem;
            color: #333;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin-bottom: 0.2rem;
            font-family: var(--heading-font);
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-with-loader {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-align: center;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem 0.7rem 1.2rem 0.7rem;
                max-width: 98vw;
            }

            .tabs {
                font-size: 1rem;
            }

            .btn {
                font-size: 1.05rem;
                padding: 0.7rem 0.5rem;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="login-title">Welcome to Triple-S</div>
        <div class="tabs">
            <button class="tab active" id="signInTab" onclick="showForm('signIn')">Sign In</button>
            <button class="tab" id="signUpTab" onclick="showForm('signUp')">Sign Up</button>
        </div>
        <p style="text-align: center; margin-bottom: 20px; color: #666; font-size: 0.9rem;">
            Login is optional. You can continue using Triple-S without signing in.
            <a href="index.html" style="color: #6a82fb; text-decoration: none; font-weight: 600;">Return to Home</a>
        </p>
        <!-- Sign In Form -->
        <form class="form active" id="signInForm" autocomplete="on">
            <div class="input-group">
                <label for="signin-email">Email</label>
                <input type="email" id="signin-email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="error-message" id="signin-error"></div>
            <button type="submit" class="btn btn-with-loader">
                Sign In
                <span class="loader" id="signin-loader"></span>
            </button>

            <span class="switch-link" onclick="showForm('signUp')">Don't have an account? Sign Up</span>
        </form>
        <!-- Sign Up Form -->
        <form class="form" id="signUpForm" autocomplete="on">
            <div class="input-group">
                <label for="signup-name">Name</label>
                <input type="text" id="signup-name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="input-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
            </div>
            <div class="error-message" id="signup-error"></div>
            <button type="submit" class="btn btn-with-loader">
                Sign Up
                <span class="loader" id="signup-loader"></span>
            </button>

            <span class="switch-link" onclick="showForm('signIn')">Already have an account? Sign In</span>
        </form>
    </div>

    <!-- Firebase SDK imports -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCHZcDv3pXIU9J3CASXi3sM-V7mZsMuqBM",
            authDomain: "triple-s-bd006.firebaseapp.com",
            projectId: "triple-s-bd006",
            storageBucket: "triple-s-bd006.firebasestorage.app",
            messagingSenderId: "933483210420",
            appId: "1:933483210420:web:66fde1b5571ef1741299e1",
            measurementId: "G-TPHZ0H6L5J"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // Authentication configuration

        // Set persistence to LOCAL (persists even when browser is closed)
        setPersistence(auth, browserLocalPersistence)
            .then(() => {
                console.log("Persistence set to LOCAL");
            })
            .catch((error) => {
                console.error("Error setting persistence:", error);
            });

        // Helper function to show/hide loaders and error messages
        function showLoader(formId) {
            document.getElementById(`${formId}-loader`).style.display = 'inline-block';
            document.getElementById(`${formId}-error`).style.display = 'none';
            document.getElementById(`${formId}-error`).textContent = '';
        }

        function hideLoader(formId) {
            document.getElementById(`${formId}-loader`).style.display = 'none';
        }

        function showError(formId, message) {
            document.getElementById(`${formId}-error`).style.display = 'block';
            document.getElementById(`${formId}-error`).textContent = message;
            hideLoader(formId);
        }

        // Handle sign in form submission
        document.getElementById('signInForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            showLoader('signin');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in successfully
                    const user = userCredential.user;
                    console.log("User signed in:", user);
                    // Redirect to main page
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Sign in error:", errorCode, errorMessage);

                    // Show user-friendly error message
                    let friendlyMessage = "Sign in failed. Please try again.";
                    if (errorCode === 'auth/wrong-password') {
                        friendlyMessage = "Incorrect password. Please try again.";
                    } else if (errorCode === 'auth/user-not-found') {
                        friendlyMessage = "No account found with this email.";
                    } else if (errorCode === 'auth/invalid-credential') {
                        friendlyMessage = "Invalid login credentials.";
                    }

                    showError('signin', friendlyMessage);
                });
        });

        // Handle sign up form submission
        document.getElementById('signUpForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            showLoader('signup');

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed up successfully
                    const user = userCredential.user;

                    // Update user profile with name
                    return updateProfile(user, {
                        displayName: name
                    }).then(() => {
                        console.log("User profile updated with name:", name);
                        return user;
                    });
                })
                .then((user) => {
                    console.log("User signed up:", user);
                    // Redirect to main page
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Sign up error:", errorCode, errorMessage);

                    // Show user-friendly error message
                    let friendlyMessage = "Sign up failed. Please try again.";
                    if (errorCode === 'auth/email-already-in-use') {
                        friendlyMessage = "This email is already registered.";
                    } else if (errorCode === 'auth/weak-password') {
                        friendlyMessage = "Password is too weak. Use at least 6 characters.";
                    } else if (errorCode === 'auth/invalid-email') {
                        friendlyMessage = "Invalid email address.";
                    }

                    showError('signup', friendlyMessage);
                });
        });

        // Social authentication removed

        // Check if user is already signed in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in
                console.log("User is already signed in:", user);
                // Auto-redirect if already signed in
                window.location.href = "index.html";
            } else {
                // User is signed out
                console.log("No user is signed in.");
            }
        });
    </script>

    <script>
        function showForm(form) {
            const signInTab = document.getElementById('signInTab');
            const signUpTab = document.getElementById('signUpTab');
            const signInForm = document.getElementById('signInForm');
            const signUpForm = document.getElementById('signUpForm');
            if (form === 'signIn') {
                signInTab.classList.add('active');
                signUpTab.classList.remove('active');
                signInForm.classList.add('active');
                signUpForm.classList.remove('active');
            } else {
                signUpTab.classList.add('active');
                signInTab.classList.remove('active');
                signUpForm.classList.add('active');
                signInForm.classList.remove('active');
            }

            // Clear error messages when switching forms
            document.getElementById('signin-error').style.display = 'none';
            document.getElementById('signup-error').style.display = 'none';
        }
    </script>
</body>

</html>
